[package]
name = "ferrumos"
description = "Modular Rust operating system for x86_64"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
authors = ["FerrumOS Team"]
publish = false

[workspace]
resolver = "2"
exclude = [
    "POC/ferrumos_PoC",
    "POC/ferrum_Poc_adaptative_sheduller",
    "POC/ferrum_Poc_graphic",
    "libs/ferrum_alloc",
    "research/heap-allocator/bench",
    "tools/image-builder",
]

[features]
baremetal = []

[dependencies]
bootloader_api = "=0.11.15"
font8x8 = { version = "=0.3.1", default-features = false, features = ["unicode"] }
pc-keyboard = "=0.7.0"

[[bin]]
name = "ferrumos"
path = "src/main.rs"
required-features = ["baremetal"]
test = false
bench = false

[lints.rust]
missing_docs = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
