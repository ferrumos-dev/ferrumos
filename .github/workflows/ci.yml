name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: nightly

jobs:
  build-reference-poc:
    # Runs only in the dev repo, not in the Epitech copy (see sync-epitech.yml).
    if: github.repository_owner != 'EpitechPGE3-2025'
    name: Build Reference PoC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Same pin as the Scheduler PoC: x86_64 0.14 stops compiling once the
      # Step trait gains forward_overflowing (newer nightlies).
      - name: Install Rust nightly-2026-01-15
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-01-15
          components: rust-src, llvm-tools-preview
      - name: Install bootimage
        run: cargo install bootimage --version 0.10.3 --locked
      - name: Build Reference PoC
        # target, build-std and runner come from .cargo/config.toml
        run: |
          cd POC/ferrumos_PoC
          cargo bootimage
      - name: Upload boot image
        uses: actions/upload-artifact@v4
        with:
          name: ferrumos-reference-bootimage
          path: POC/ferrumos_PoC/target/x86_64-ferrumos/debug/bootimage-ferrumos.bin

  build-scheduler-poc:
    # Runs only in the dev repo, not in the Epitech copy (see sync-epitech.yml).
    if: github.repository_owner != 'EpitechPGE3-2025'
    name: Build Scheduler PoC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned (see POC/ferrum_Poc_adaptative_sheduller/test_environment.md):
      # newer nightlies break x86_64 0.14 and bootimage > 0.10.3 passes
      # -Zjson-target-spec, unknown to this toolchain.
      - name: Install Rust nightly-2026-01-15
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-01-15
          components: rust-src, llvm-tools-preview
      - name: Install bootimage
        run: cargo install bootimage --version 0.10.3 --locked
      - name: Build Scheduler PoC
        # target, build-std and runner come from .cargo/config.toml
        run: |
          cd POC/ferrum_Poc_adaptative_sheduller
          cargo bootimage
      - name: Upload boot image
        uses: actions/upload-artifact@v4
        with:
          name: ferrumos-scheduler-bootimage
          path: POC/ferrum_Poc_adaptative_sheduller/target/x86_64-ferrumos/debug/bootimage-ferrumos.bin

  build-graphics-poc:
    # Runs only in the dev repo, not in the Epitech copy (see sync-epitech.yml).
    if: github.repository_owner != 'EpitechPGE3-2025'
    name: Build Graphics PoC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # bootloader 0.11 builds its own stages with x86_64 0.15, which needs a
      # nightly that has Step::forward_overflowing, so this PoC cannot share
      # the 2026-01-15 pin. No bootimage: the image is made by build.rs.
      - name: Install Rust nightly-2026-11-16
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-11-16
          targets: x86_64-unknown-none
          components: rust-src, llvm-tools-preview
      - name: Build Graphics PoC
        run: |
          cd POC/ferrum_Poc_graphic
          make build
      - name: Upload boot image
        uses: actions/upload-artifact@v4
        with:
          name: ferrumos-graphics-bootimage
          path: POC/ferrum_Poc_graphic/target/debug/build/**/ferrumos_graphic-bios.img
          if-no-files-found: error

  lint:
    # Runs only in the dev repo, not in the Epitech copy (see sync-epitech.yml).
    if: github.repository_owner != 'EpitechPGE3-2025'
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, clippy, rustfmt
      - name: Check formatting (Reference PoC)
        run: |
          cd POC/ferrumos_PoC
          cargo fmt -- --check || echo "Formatting check skipped (no_std)"
      - name: Clippy (Reference PoC)
        run: |
          cd POC/ferrumos_PoC
          cargo clippy --target x86_64-ferrumos.json 2>&1 || true