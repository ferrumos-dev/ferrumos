name: Kernel tests (QEMU)

# Boots every kernel test image under QEMU, keeps the results and compares
# them with the baseline. See docs/greenlights/objecitf_obligatoire_2/md/automatisation_tests_qemu.md.

on:
  push:
    paths:
      - "POC/ferrum_Poc_adaptative_sheduller/**"
      - "libs/ferrum_alloc/**"
      - "research/heap-allocator/**"
      - "scripts/kernel_tests/**"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "POC/rust-toolchain.toml"
      - ".github/workflows/kernel-tests.yml"
  pull_request:
    paths:
      - "POC/ferrum_Poc_adaptative_sheduller/**"
      - "libs/ferrum_alloc/**"
      - "research/heap-allocator/**"
      - "scripts/kernel_tests/**"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "POC/rust-toolchain.toml"
      - ".github/workflows/kernel-tests.yml"
  workflow_dispatch:

env:
  # Pinned: newer versions do not build this kernel, see test_environment.md
  RUST_TOOLCHAIN: nightly-2026-01-15
  BOOTIMAGE_VERSION: 0.10.3
  POC_DIR: POC/ferrum_Poc_adaptative_sheduller
  RESULTS_BRANCH: test-results
  CARGO_TERM_COLOR: never

jobs:
  results-tool:
    # Runs only in the dev repo, not in the Epitech copy (see sync-epitech.yml).
    if: github.repository_owner != 'EpitechPGE3-2025'
    name: Results tool self-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s scripts/kernel_tests -v

  heap-allocator:
    # Runs only in the dev repo, not in the Epitech copy (see sync-epitech.yml).
    if: github.repository_owner != 'EpitechPGE3-2025'
    name: Heap allocator format, Clippy, unit tests and benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Same pinned toolchain as the kernel that embeds the crate.
      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - name: Select the pinned toolchain for all Cargo commands
        run: |
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
          rustc +"$RUST_TOOLCHAIN" --version --verbose
      # Blocking checks (normes_rust.md): no `|| true`, exit codes propagate.
      # ferrum_alloc denies undocumented unsafe blocks, so Clippy also checks
      # that every unsafe block has its SAFETY comment.
      - name: Format (libs/ferrum_alloc, research/heap-allocator/bench)
        run: |
          cargo fmt --manifest-path libs/ferrum_alloc/Cargo.toml -- --check
          cargo fmt --manifest-path research/heap-allocator/bench/Cargo.toml -- --check
      - name: Clippy (libs/ferrum_alloc, research/heap-allocator/bench)
        run: |
          cargo clippy --manifest-path libs/ferrum_alloc/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path research/heap-allocator/bench/Cargo.toml --locked --all-targets -- -D warnings
      - name: Unit tests (libs/ferrum_alloc)
        working-directory: libs/ferrum_alloc
        run: cargo test
      - name: Decision prototype benchmark (research/heap-allocator/bench)
        working-directory: research/heap-allocator/bench
        # Deterministic columns must match docs/greenlights/objecitf_obligatoire_1/tas_noyau/06_prototype_decision.md;
        # timings depend on the runner and are only indicative.
        run: cargo run --release --locked -- --output bench.json | tee -a "$GITHUB_STEP_SUMMARY"

  qemu-tests:
    # Runs only in the dev repo, not in the Epitech copy (see sync-epitech.yml).
    if: github.repository_owner != 'EpitechPGE3-2025'
    name: Kernel tests under QEMU
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86

      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rust-src, llvm-tools-preview
      - name: Select the pinned toolchain for all Cargo commands
        run: |
          echo "RUSTUP_TOOLCHAIN=$RUST_TOOLCHAIN" >> "$GITHUB_ENV"
          rustc +"$RUST_TOOLCHAIN" --version --verbose

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.POC_DIR }}

      - name: Install bootimage ${{ env.BOOTIMAGE_VERSION }}
        run: cargo install bootimage --version "$BOOTIMAGE_VERSION" --locked

      - name: Fetch previous results
        run: |
          if git fetch --depth=1 origin "$RESULTS_BRANCH" 2>/dev/null; then
            git show FETCH_HEAD:latest.json > previous-results.json || rm -f previous-results.json
          fi
          [ -f previous-results.json ] && echo "comparing with the last run on main" || echo "no previous results yet"

      - name: Run kernel tests
        env:
          OUT_DIR: ${{ github.workspace }}/kernel-test-results
          RESULTS_SOURCE: ci
          RESULTS_COMMIT: ${{ github.sha }}
          RESULTS_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: bash scripts/kernel_tests/run.sh --previous previous-results.json

      - name: Publish report
        if: always()
        run: |
          if [ -f kernel-test-results/report.md ]; then
            cat kernel-test-results/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report: the tests did not run, see the step logs." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-test-results-${{ github.sha }}
          path: kernel-test-results/
          retention-days: 90
          # Missing results must be visible (ci_cd.md).
          if-no-files-found: error

  store-results:
    name: Keep results history
    needs: qemu-tests
    if: github.repository_owner != 'EpitechPGE3-2025' && (always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.qemu-tests.result != 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: kernel-test-results-history
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: kernel-test-results-${{ github.sha }}
          path: new-results

      - name: Commit results to the ${{ env.RESULTS_BRANCH }} branch
        run: bash scripts/kernel_tests/store_history.sh new-results
